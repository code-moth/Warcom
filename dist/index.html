<title>Warcom Command</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ============================= Design tokens ============================= */
  :root {
    color-scheme: light;
    --paper: #ece1c4;
    --paper-panel: #f5eeda;
    --paper-raised: #faf5e7;
    --paper-deep: #d6c493;
    --line: #b39c68;
    --line-soft: #cdb984;
    --ink: #2a2013;
    --ink-soft: #5c4a30;
    --ink-faint: #8a7857;
    --accent-red: #7c2e1f;
    --accent-red-soft: #a8563f;
    --accent-blue: #294256;
    --accent-blue-soft: #4d6a80;
    --accent-gold: #93711f;
    --ok-green: #3c5b37;
    --shadow: 0 1px 0 rgba(42, 32, 19, 0.06);
    --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --font-body: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #1b160f;
      --paper-panel: #221b13;
      --paper-raised: #2a2117;
      --paper-deep: #3c2f1e;
      --line: #4a3c26;
      --line-soft: #5e4d30;
      --ink: #ecdfbf;
      --ink-soft: #bda67b;
      --ink-faint: #82724f;
      --accent-red: #cf6a4f;
      --accent-red-soft: #a8563f;
      --accent-blue: #7fa0b8;
      --accent-blue-soft: #5c7c93;
      --accent-gold: #d1a53f;
      --ok-green: #7f9d76;
      --shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #1b160f;
    --paper-panel: #221b13;
    --paper-raised: #2a2117;
    --paper-deep: #3c2f1e;
    --line: #4a3c26;
    --line-soft: #5e4d30;
    --ink: #ecdfbf;
    --ink-soft: #bda67b;
    --ink-faint: #82724f;
    --accent-red: #cf6a4f;
    --accent-red-soft: #a8563f;
    --accent-blue: #7fa0b8;
    --accent-blue-soft: #5c7c93;
    --accent-gold: #d1a53f;
    --ok-green: #7f9d76;
    --shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.45;
    margin: 0;
    padding-inline: 0;
  }
  h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  table { border-collapse: collapse; }
  ::selection { background: var(--accent-gold); color: var(--paper-raised); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent-blue); outline-offset: 1px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ============================= App chrome ============================= */
  #app { display: flex; flex-direction: column; min-height: 100dvh; }

  .dispatch-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
    background: var(--paper-panel);
    border-bottom: 2px solid var(--line);
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; margin-right: 6px; }
  .brand .mark { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: 0.01em; }
  .brand .mark .rule { color: var(--accent-red); }
  .brand .tagline { font-size: 11px; color: var(--ink-faint); font-style: italic; }
  .battle-name-field { display: flex; align-items: center; gap: 6px; }
  .battle-name-field label { font-size: 11px; color: var(--ink-soft); }
  #battleName {
    background: transparent; border: none; border-bottom: 1px solid var(--line);
    font-family: var(--font-display); font-size: 16px; font-weight: 600; color: var(--ink);
    padding: 2px 4px; min-width: 10ch; width: 26ch; max-width: 40vw;
  }
  #battleName:focus { border-bottom-color: var(--accent-gold); }
  .dispatch-spacer { flex: 1 1 auto; }
  .round-chip {
    font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft);
    border: 1px solid var(--line); border-radius: 3px; padding: 4px 8px; background: var(--paper-raised);
  }

  .btn {
    font-family: var(--font-body); font-weight: 600; font-size: 12.5px;
    border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink);
    padding: 7px 12px; border-radius: 3px; box-shadow: var(--shadow);
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent-gold); }
  .btn:disabled { opacity: 0.42; cursor: not-allowed; }
  .btn-quiet { background: transparent; border-color: transparent; box-shadow: none; }
  .btn-quiet:hover { border-color: var(--line); }
  .btn-danger { color: var(--accent-red); border-color: var(--accent-red-soft); }
  .btn-danger:hover { background: color-mix(in srgb, var(--accent-red) 10%, var(--paper-raised)); }
  .btn-seal {
    background: var(--accent-red); border-color: var(--accent-red); color: #f6ead9;
    font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 9px 18px;
    border-radius: 999px;
  }
  .btn-seal:hover { background: var(--accent-red-soft); }
  .btn-seal:disabled { background: var(--ink-faint); border-color: var(--ink-faint); color: var(--paper-panel); }
  .btn-sm { padding: 4px 8px; font-size: 11.5px; }
  .icon-btn { border: none; background: transparent; color: var(--ink-soft); padding: 4px 6px; border-radius: 3px; }
  .icon-btn:hover { color: var(--accent-red); background: color-mix(in srgb, var(--accent-red) 8%, transparent); }

  .layout { flex: 1 1 auto; display: flex; min-height: 0; }

  /* ---- roster rail ---- */
  .roster-rail {
    width: 280px; flex: 0 0 auto; border-right: 2px solid var(--line);
    background: var(--paper-panel); display: flex; flex-direction: column; min-height: 0;
  }
  .roster-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line-soft); }
  .roster-head h2 { font-size: 13px; letter-spacing: 0.03em; color: var(--ink-soft); font-weight: 700; }
  .roster-search {
    margin-top: 6px; width: 100%; background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 3px; padding: 6px 8px; color: var(--ink);
  }
  .roster-list { flex: 1 1 auto; overflow-y: auto; }
  .roster-row {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 7px 12px; border: none; border-bottom: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
    background: transparent; color: var(--ink);
  }
  .roster-row:hover { background: var(--paper-raised); }
  .roster-row.selected { background: var(--paper-deep); }
  .roster-row .rr-num { font-family: var(--font-mono); font-size: 11px; color: var(--ink-faint); width: 2.4em; flex: none; }
  .roster-row .rr-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .roster-row .rr-name.blank { color: var(--ink-faint); font-style: italic; font-weight: 400; }
  .roster-row .rr-icons { display: flex; gap: 2px; flex: none; font-size: 11px; }
  .roster-row .rr-pct { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); width: 3.2em; text-align: right; flex: none; }
  .stamp {
    display: inline-flex; align-items: center; justify-content: center;
    width: 16px; height: 16px; border-radius: 50%; font-size: 9.5px; font-weight: 700;
    font-family: var(--font-mono); flex: none; line-height: 1;
  }
  .stamp-morale-A { background: color-mix(in srgb, var(--ok-green) 25%, transparent); color: var(--ok-green); }
  .stamp-morale-B { background: color-mix(in srgb, var(--accent-gold) 28%, transparent); color: var(--accent-gold); }
  .stamp-morale-C, .stamp-morale-D { background: color-mix(in srgb, var(--accent-red-soft) 25%, transparent); color: var(--accent-red-soft); }
  .stamp-morale-E { background: color-mix(in srgb, var(--accent-red) 32%, transparent); color: var(--accent-red); }
  .roster-empty { padding: 18px 14px; color: var(--ink-faint); font-style: italic; font-size: 12.5px; }
  .roster-foot { padding: 8px 10px; border-top: 1px solid var(--line-soft); }
  .roster-foot .btn { width: 100%; justify-content: center; }

  /* ---- main panel ---- */
  .main-panel { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tab-strip { display: flex; gap: 2px; padding: 10px 14px 0; background: var(--paper); border-bottom: 2px solid var(--line); flex-wrap: wrap; }
  .tab-btn {
    font-family: var(--font-display); font-weight: 600; font-size: 13.5px;
    background: var(--paper-deep); color: var(--ink-soft); border: 2px solid var(--line);
    border-bottom: none; border-radius: 6px 6px 0 0; padding: 7px 16px; position: relative; top: 2px;
  }
  .tab-btn.active { background: var(--paper); color: var(--ink); border-bottom: 2px solid var(--paper); }
  .tab-btn .count { font-family: var(--font-mono); font-size: 10.5px; margin-left: 5px; color: var(--ink-faint); }

  .tab-panels { flex: 1 1 auto; overflow-y: auto; padding: 18px 22px 40px; }
  .panel { max-width: 980px; }
  .panel-empty { color: var(--ink-faint); font-style: italic; padding: 30px 4px; }

  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 16px; margin-bottom: 18px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--ink-soft); font-weight: 600; letter-spacing: 0.01em; }
  .field input, .field select {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 3px;
    padding: 7px 9px; color: var(--ink);
  }
  .field input:focus, .field select:focus { border-color: var(--accent-gold); }
  .field .hint { font-size: 10.5px; color: var(--ink-faint); }
  .field.wide { grid-column: span 2; }

  section.block { margin-bottom: 22px; }
  section.block > h3 { font-size: 13px; letter-spacing: 0.03em; color: var(--accent-gold); text-transform: uppercase; font-weight: 700; margin-bottom: 10px; border-bottom: 1px solid var(--line-soft); padding-bottom: 6px; }

  table.ledger { width: 100%; border-collapse: collapse; }
  table.ledger caption { text-align: left; caption-side: top; }
  table.ledger th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); padding: 5px 8px; border-bottom: 1px solid var(--line); }
  table.ledger td { padding: 4px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 40%, transparent); vertical-align: middle; }
  table.ledger td.num, table.ledger th.num { text-align: right; }
  table.ledger input.cell {
    width: 100%; background: transparent; border: none; border-bottom: 1px dashed transparent;
    padding: 4px 2px; text-align: right; color: var(--ink); font-family: var(--font-mono);
  }
  table.ledger input.cell:hover { border-bottom-color: var(--line); }
  table.ledger input.cell:focus { border-bottom-color: var(--accent-gold); background: var(--paper-raised); }
  table.ledger tr.stat-row th.rowlabel { text-align: left; text-transform: none; font-family: var(--font-body); font-weight: 600; color: var(--ink); font-size: 12.5px; }

  .actions-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

  /* attacks tab */
  .queue-table-wrap, .weapon-table-wrap, .log-list { overflow-x: auto; }
  table.queue { width: 100%; min-width: 760px; }
  table.queue th, table.queue td { padding: 6px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 45%, transparent); font-size: 12.5px; }
  table.queue th { text-align: left; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-soft); }
  table.queue select, table.queue input { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 3px; padding: 5px 6px; width: 100%; }
  table.queue tr.problem { background: color-mix(in srgb, var(--accent-red) 7%, transparent); }
  .cell-note { font-size: 10.5px; color: var(--accent-red-soft); margin-top: 2px; }
  .preview-note { font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }

  .log-entry { border: 1px solid var(--line); border-radius: 6px; background: var(--paper-panel); padding: 12px 14px; margin-bottom: 12px; }
  .log-entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .log-entry-head h4 { font-size: 13px; font-family: var(--font-display); font-weight: 700; }
  .log-entry-head .ts { font-size: 11px; color: var(--ink-faint); font-family: var(--font-mono); }
  .log-line { display: flex; gap: 8px; padding: 4px 0; border-top: 1px solid color-mix(in srgb, var(--line) 35%, transparent); font-size: 12.5px; flex-wrap: wrap; align-items: baseline; }
  .log-line:first-of-type { border-top: none; }
  .log-line .arrow { color: var(--ink-faint); }
  .log-line .tag { font-family: var(--font-mono); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); }
  .log-line .tag.elim { color: var(--accent-red); border-color: var(--accent-red-soft); }
  .log-line .tag.moralefail { color: var(--accent-gold); border-color: var(--accent-gold); }
  .log-abort { color: var(--accent-red); font-size: 12.5px; }

  /* weapons tab */
  .weapon-layout { display: flex; gap: 18px; }
  .weapon-list { width: 220px; flex: none; border-right: 1px solid var(--line-soft); max-height: 70vh; overflow-y: auto; }
  .weapon-list button {
    display: block; width: 100%; text-align: left; background: transparent; border: none;
    padding: 6px 10px; color: var(--ink); font-size: 12.5px; border-radius: 3px;
  }
  .weapon-list button:hover { background: var(--paper-raised); }
  .weapon-list button.active { background: var(--paper-deep); font-weight: 600; }
  .weapon-list button .flag { color: var(--accent-red-soft); font-size: 10px; margin-left: 4px; }
  .weapon-detail { flex: 1 1 auto; min-width: 0; }
  table.armor-table { width: 100%; }
  table.armor-table th, table.armor-table td { padding: 5px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 40%, transparent); font-size: 12px; text-align: right; }
  table.armor-table th:first-child, table.armor-table td:first-child { text-align: left; }
  .incomplete-banner { background: color-mix(in srgb, var(--accent-red) 10%, transparent); border: 1px solid var(--accent-red-soft); color: var(--accent-red); padding: 8px 10px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }

  /* settings tab */
  .toggle-row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 40%, transparent); }
  .toggle-row input[type="checkbox"] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--accent-red); }
  .toggle-row .t-label { font-weight: 600; font-size: 13px; }
  .toggle-row .t-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .file-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
  input[type="file"] { display: none; }

  .status-banner {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--ink); color: var(--paper-raised); padding: 10px 16px; border-radius: 6px;
    font-size: 12.5px; max-width: min(90vw, 560px); box-shadow: 0 4px 18px rgba(0,0,0,0.3); z-index: 50;
  }
  .status-banner.error { background: var(--accent-red); }
  .status-banner.ok { background: var(--ok-green); }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20, 15, 8, 0.55); display: flex; align-items: center; justify-content: center; z-index: 60; padding: 16px;
  }
  .modal {
    background: var(--paper-panel); border: 2px solid var(--line); border-radius: 8px; padding: 18px 20px;
    max-width: 460px; width: 100%; max-height: 82vh; overflow-y: auto;
  }
  .modal h3 { font-size: 15px; margin-bottom: 8px; }
  .modal p { font-size: 12.5px; color: var(--ink-soft); margin: 0 0 12px; }
  .modal .actions-row { justify-content: flex-end; }
  .modal ul.err-list { font-size: 11.5px; color: var(--accent-red); max-height: 160px; overflow-y: auto; padding-left: 18px; margin: 0 0 12px; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
    .roster-rail { width: 100%; border-right: none; border-bottom: 2px solid var(--line); max-height: 38vh; }
    .tab-panels { padding: 14px 14px 32px; }
    .field-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .weapon-layout { flex-direction: column; }
    .weapon-list { width: 100%; max-height: 30vh; border-right: none; border-bottom: 1px solid var(--line-soft); }
  }
</style>

<div id="app">
  <header class="dispatch-bar">
    <div class="brand">
      <span class="mark">WARCOM<span class="rule">·</span>COMMAND</span>
      <span class="tagline">a War Law mass-combat table</span>
    </div>
    <div class="battle-name-field">
      <label for="battleName">Battle</label>
      <input id="battleName" type="text" maxlength="60" placeholder="Unnamed engagement" />
    </div>
    <div class="dispatch-spacer"></div>
    <span class="round-chip" id="queueSummary">0 attacks queued</span>
    <button class="btn btn-seal" id="resolveAllBtn">Resolve queue</button>
  </header>

  <div class="layout">
    <aside class="roster-rail">
      <div class="roster-head">
        <h2>Roster</h2>
        <input class="roster-search" id="rosterSearch" type="search" placeholder="Filter units by name or race…" />
      </div>
      <div class="roster-list" id="rosterList"></div>
      <div class="roster-foot">
        <button class="btn" id="addUnitBtn">+ Add unit</button>
      </div>
    </aside>

    <main class="main-panel">
      <nav class="tab-strip" id="tabStrip">
        <button class="tab-btn" data-tab="unit">Unit</button>
        <button class="tab-btn" data-tab="attacks">Attacks<span class="count" id="tabAttackCount"></span></button>
        <button class="tab-btn" data-tab="log">Battle log<span class="count" id="tabLogCount"></span></button>
        <button class="tab-btn" data-tab="weapons">Weapons</button>
        <button class="tab-btn" data-tab="settings">Settings</button>
      </nav>
      <div class="tab-panels" id="tabPanels"></div>
    </main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="statusRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script type="module" src="./app.js"></script>
